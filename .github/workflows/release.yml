name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CENTRAL_LICENSE_KEY: ${{ secrets.CENTRAL_LICENSE_KEY }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile

      - name: Build engine
        run: pnpm --filter @forkshop/engine build

      - name: Build CLI
        run: pnpm --filter forkshop build

      - name: Publish engine
        run: pnpm --filter @forkshop/engine publish --no-git-checks --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish CLI
        run: pnpm --filter forkshop publish --no-git-checks --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Release notes come from the annotated tag's body (kept short
        # and hand-curated). Falls back to --generate-notes if the tag
        # is lightweight (no body).
        run: |
          NOTES=$(git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}")
          if [ -z "${NOTES}" ]; then
            gh release create "${GITHUB_REF_NAME}" --generate-notes
          else
            gh release create "${GITHUB_REF_NAME}" --notes "${NOTES}"
          fi
